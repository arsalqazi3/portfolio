name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Build and scan image
    needs: test
    runs-on: ubuntu-latest
    # This validates the self-hosted deployment path still builds cleanly
    # and stays free of known-critical vulnerabilities. Deployment itself
    # is handled by Vercel (see docs/adr/0007-vercel-over-self-hosted-oracle-vm.md) —
    # this job doesn't push or deploy the image anywhere.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/portfolio:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/portfolio:scan
          format: table
          severity: CRITICAL
          exit-code: "1"
