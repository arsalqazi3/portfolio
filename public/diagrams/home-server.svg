<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title">
  <title id="title">Home server architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9b9589"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- My devices -->
    <text x="76" y="96" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9b9589">MY DEVICES</text>
    <rect x="16" y="110" width="120" height="46" rx="6" fill="#1f1f1c" stroke="#3a3733"/>
    <text x="76" y="138" font-size="14" fill="#e8e3d8">Laptop</text>
    <rect x="16" y="196" width="120" height="46" rx="6" fill="#1f1f1c" stroke="#3a3733"/>
    <text x="76" y="224" font-size="14" fill="#e8e3d8">Phone</text>

    <!-- Tailscale -->
    <rect x="196" y="150" width="150" height="56" rx="6" fill="#1f1f1c" stroke="#b87333"/>
    <text x="271" y="174" font-size="14" font-weight="600" fill="#e8e3d8">Tailscale</text>
    <text x="271" y="193" font-size="11" fill="#9b9589">private access, HTTPS</text>

    <line x1="136" y1="133" x2="194" y2="166" stroke="#9b9589" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="136" y1="219" x2="194" y2="190" stroke="#9b9589" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="346" y1="178" x2="382" y2="178" stroke="#9b9589" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Mac mini -->
    <rect x="384" y="16" width="380" height="330" rx="8" fill="none" stroke="#9b9589"/>
    <text x="400" y="40" text-anchor="start" font-size="13" font-weight="600" fill="#e8e3d8">Mac mini, Ubuntu 26.04 LTS</text>
    <text x="400" y="57" text-anchor="start" font-size="11" fill="#9b9589">headless, on Ethernet</text>

    <!-- Docker -->
    <rect x="400" y="70" width="348" height="262" rx="6" fill="none" stroke="#3a3733" stroke-dasharray="5 4"/>
    <text x="412" y="88" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9b9589">DOCKER</text>

    <rect x="412" y="98" width="148" height="50" rx="5" fill="#1f1f1c" stroke="#3a3733"/>
    <text x="486" y="119" font-size="13" fill="#e8e3d8">Immich</text>
    <text x="486" y="136" font-size="11" fill="#9b9589">photos</text>

    <rect x="590" y="98" width="148" height="50" rx="5" fill="#1f1f1c" stroke="#3a3733"/>
    <text x="664" y="119" font-size="13" fill="#e8e3d8">Nextcloud</text>
    <text x="664" y="136" font-size="11" fill="#9b9589">files, Postgres, Redis</text>

    <rect x="412" y="168" width="148" height="50" rx="5" fill="#1f1f1c" stroke="#3a3733"/>
    <text x="486" y="189" font-size="13" fill="#e8e3d8">AdGuard Home</text>
    <text x="486" y="206" font-size="11" fill="#9b9589">DNS ad blocking</text>

    <rect x="590" y="168" width="148" height="50" rx="5" fill="#1f1f1c" stroke="#3a3733"/>
    <text x="664" y="189" font-size="13" fill="#e8e3d8">Unbound</text>
    <text x="664" y="206" font-size="11" fill="#9b9589">caching DNS resolver</text>

    <rect x="412" y="238" width="148" height="50" rx="5" fill="#1f1f1c" stroke="#3a3733"/>
    <text x="486" y="259" font-size="13" fill="#e8e3d8">Hermes Agent</text>
    <text x="486" y="276" font-size="11" fill="#9b9589">control from my phone</text>

    <line x1="560" y1="193" x2="588" y2="193" stroke="#b87333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="664" y1="218" x2="664" y2="370" stroke="#b87333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Internet -->
    <rect x="590" y="372" width="148" height="40" rx="6" fill="#1f1f1c" stroke="#b87333"/>
    <text x="664" y="397" font-size="13" fill="#e8e3d8">Internet</text>
  </g>
</svg>
